# Spring Boot properties file
spring.application.name=dj16-sgdc-core
server.port=8080

# Logging
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.security.web.authentication=DEBUG
#logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Configuración Thymeleaf
spring.thymeleaf.prefix=classpath:/paginas/
spring.thymeleaf.suffix=.html

#Cambio de la página de error por defecto
server.error.whitelabel.enabled=false

#Datasource MariaDB
#spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=jdbc:mariadb://localhost:3306/clubdep20?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
#spring.jackson.time-zone=UTC
spring.jpa.show-sql=true

# Configuración de la conexión para el servidor de correo
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASSWORD}
# Protocolo SMTP con STARTTLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Confianza al certificado de Gmail
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Google reCAPTCHA
recaptcha.siteKey=${RECAPTCHA_SITE_KEY}
recaptcha.secret=${RECAPTCHA_SECRET_KEY}

