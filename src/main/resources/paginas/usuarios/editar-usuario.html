<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <div th:insert="~{plantillas/plantilla :: headContent}"></div>
    <link th:href="@{/select2/css/select2.min.css}" rel="stylesheet"/>
    <script th:src="@{/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/select2/js/select2.full.min.js}"></script>
</head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<!-- Contenido principal -->
<div class="container container-custom mt-4">
    <div class="row justify-content-center">
        <!-- Encabezado del formulario -->
        <div class="col-md-10 col-lg-8">
            <div class="text-center">
                <i class="bi bi-pencil-square" style="font-size: 3rem; color: #1976d2"
                ></i>
                <h2 class="mt-2">Editar Usuario</h2>
                <p class="text-muted">
                    Complete la información a continuación para editar el usuario.
                </p>
            </div>
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <form th:action="@{/usuarios/change-usuario}" th:object="${usuario}" method="post">
                        <!-- Campo oculto para el ID -->
                        <input type="hidden" th:field="*{id}"/>

                        <!-- Mostrar errores globales -->
                        <div th:if="${#fields.hasGlobalErrors()}" class='alert alert-danger' role="alert">
                            Verifique los siguientes inconvenientes
                            <ul>
                                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                            </ul>
                        </div>

                        <!-- Nombre del usuario -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre de Usuario</label>
                            <input
                                    type="text"
                                    class="form-control"
                                    id="nombre"
                                    th:field="*{nombre}"
                                    name="nombre"
                                    readonly
                            />
                            <div class="text-danger" th:if="${#fields.hasErrors('nombre')}"
                                 th:errors="*{nombre}"></div>
                        </div>
                        <!-- Contraseña del usuario -->
                        <div class="mb-3">
                            <label for="contrasena" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <input
                                        type="password"
                                        class="form-control"
                                        id="contrasena"
                                        th:field="*{contrasena}"
                                        name="contrasena"
                                        placeholder="Ingrese la contraseña"
                                        autocomplete="new-password"
                                />
                                <button class="btn btn-outline-secondary" type="button" id="toggleContrasena">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('contrasena')}"
                                 th:errors="*{contrasena}"></div>
                        </div>
                        <!-- Selección de Miembro -->
                        <div class="mb-3">
                            <label for="miembroSelect" class="form-label">Miembro</label>
                            <select id="miembroSelect" name="idMiembro" th:field="*{idMiembro}" class="form-control"
                                    style="width: 100%;">
                                <!-- Las opciones se cargarán vía AJAX -->
                            </select>
                            <input type="hidden" th:field="*{idMiembro}"/>
                            <div class="text-danger" th:if="${#fields.hasErrors('idMiembro')}"
                                 th:errors="*{idMiembro}"></div>
                        </div>
                        <!-- Roles -->
                        <div class="mb-3">
                            <label for="roles" class="form-label">Roles</label>
                            <select id="roles"
                                    class="form-select"
                                    multiple
                                    th:field="*{rolesIds}"
                                    required>
                                <option th:each="r : ${roles}"
                                        th:value="${r.id}"
                                        th:text="${r.nombre}"></option>
                            </select>
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('rolesIds')}"
                                 th:errors="*{rolesIds}"></div>
                        </div>


                        <div class="d-flex justify-content-end">
                            <a th:href="@{/usuarios}" class="btn btn-secondary me-2">
                                <i class="bi bi-arrow-left-circle"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{plantillas/plantilla :: footer}"></footer>

<script th:inline="javascript">
    /*<![CDATA[*/
    $(function() {
        // Thymeleaf reemplazará estas dos líneas:
        let miembroId    = /*[[${miembroId}]]*/ null;
        let miembroTexto = /*[[${miembroTexto}]]*/ '';

        if (miembroId) {
            // creamos la opción seleccionada en Select2
            let option = new Option(miembroTexto, miembroId, true, true);
            $('#miembroSelect').append(option).trigger('change');
        }

        $('#miembroSelect').select2({
            placeholder: 'Buscar miembro por nombre, correo, etc.',
            ajax: {
                url: '/api/miembros/search',
                dataType: 'json',
                delay: 250,
                data: params => ({ q: params.term }),
                processResults: data => ({
                    results: data.map(item => ({
                        id: item.id,
                        text: item.nombre + ' ' + item.apellidoPaterno + ' ' + item.apellidoMaterno
                    }))
                }),
                cache: true
            },
            minimumInputLength: 1
        });

        // Toggle de contraseña:
        $('#toggleContrasena').on('click', function() {
            const $input = $('#contrasena');
            const $icon  = $(this).find('i');
            if ($input.attr('type') === 'password') {
                $input.attr('type', 'text');
                $icon.removeClass('bi-eye').addClass('bi-eye-slash');
            } else {
                $input.attr('type', 'password');
                $icon.removeClass('bi-eye-slash').addClass('bi-eye');
            }
        });
    });
    /*]]>*/
</script>

</body>
</html>
