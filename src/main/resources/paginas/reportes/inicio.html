<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>
<!-- Contenido principal -->
<div class="container mt-4">
    <h2 class="mb-4">Reportes</h2>
    <div class="row g-3">
        <div class="col-md-4">
            <div class="card card-report">
                <div class="card-body text-center">
                    <i class="bi bi-people-fill" style="font-size: 2rem"></i>
                    <h5 class="card-title mt-2">Membresías</h5>
                    <p class="card-text">Reporte de estado de membresías.</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-report">
                <div class="card-body text-center">
                    <i class="bi bi-calendar-check" style="font-size: 2rem"></i>
                    <h5 class="card-title mt-2">Reservas</h5>
                    <p class="card-text">Reporte de ocupación de instalaciones.</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-report">
                <div class="card-body text-center">
                    <i class="bi bi-currency-dollar" style="font-size: 2rem"></i>
                    <h5 class="card-title mt-2">Pagos</h5>
                    <p class="card-text">Reporte de ingresos y pagos realizados.</p>
                </div>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
</body>
</html>
