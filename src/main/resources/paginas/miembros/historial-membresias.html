<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<!-- Contenido principal -->
<div class="container mt-4 container-custom">
    <!-- Encabezado -->
    <div class="row justify-content-center mb-4">
        <div class="col-12 text-center">
            <i class="bi bi-clock-history" style="font-size: 3rem; color: #1976d2"></i>
            <h2 class="mt-2">Historial de Membresías del Miembro</h2>
            <p class="text-muted"
               th:text="'Historial de membresías para: ' + ${miembro.nombre} + ' ' + ${miembro.apellidoPaterno} + ' ' + ${miembro.apellidoMaterno}">
            </p>
        </div>
    </div>

    <!-- Opcional: Filtro específico para el historial -->
    <form id="searchForm" th:action="@{/miembros/historial-membresias}" method="get">
        <div class="row mb-3">
            <div class="col-md-6 offset-md-3">
                <div class="input-group">
                    <input type="hidden" name="id" th:value="${miembro.id}"/>
                    <input type="text" id="searchInput" name="q" class="form-control" placeholder="Filtrar por tipo, fecha, etc." th:value="${q}" aria-label="Buscar" aria-describedby="search-addon" />
                    <button class="btn btn-primary" type="submit">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                    <!-- Botón de limpiar, inicialmente oculto -->
                    <button type="button" id="clearSearch" class="btn btn-outline-secondary" style="display: none;">
                        <i class="bi bi-x"></i> Limpiar
                    </button>
                </div>
            </div>
        </div>
    </form>

    <!-- Tabla de Historial de Membresías -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead style="background-color: #e9f5ff; color: #0d6efd">
            <tr>
                <th>ID</th>
                <th>Fecha del Registro</th>
                <th>Tipo de Membresía</th>
                <th>Descripción</th>
                <th>Registrado por</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="hist : ${historialMembresias}">
                <td th:text="${hist.id}"></td>
                <td th:text="${#temporals.format(hist.fechaCambio, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${hist.membresia.nombre}"></td>
                <td th:text="${hist.descripcion}"></td>
                <td th:text="${hist.creadoPor}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(historialMembresias)}">
                <td colspan="5" class="text-center">
                    No se encontraron registros para este miembro.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Botón para volver al detalle del miembro -->
    <div class="d-flex justify-content-end">
        <a class="btn btn-secondary" th:href="@{'/miembros/get?id=' + ${miembro.id}}">
            <i class="bi bi-arrow-left-circle"></i> Volver al Detalle del Miembro
        </a>
    </div>
</div>

<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
<script>
    // Muestra el botón de limpiar si hay texto en el campo de búsqueda
    document.addEventListener("DOMContentLoaded", function() {
        const searchInput = document.getElementById("searchInput");
        const clearButton = document.getElementById("clearSearch");
        const searchForm = document.getElementById("searchForm");

        // Mostrar botón de limpiar si el campo tiene contenido al cargar la página
        if (searchInput.value.trim() !== "") {
            clearButton.style.display = "inline-block";
        }

        // Actualizar visibilidad del botón a medida que se escribe
        searchInput.addEventListener("input", function() {
            clearButton.style.display = this.value.trim() !== "" ? "inline-block" : "none";
        });

        // Al hacer clic en "Limpiar", se borra el campo y se envía el formulario sin filtro
        clearButton.addEventListener("click", function() {
            searchInput.value = "";
            searchForm.submit();
        });
    });
</script>
</body>
</html>
