<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<!-- Contenido principal -->
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <!-- Encabezado del formulario -->
            <div class="text-center mb-4">
                <i class="bi bi-card-checklist" style="font-size: 3rem; color: #1976d2"></i>
                <h2 class="mt-2">Editar Membresía</h2>
                <p class="text-muted">
                    Complete la información para editar la membresía.
                </p>
            </div>
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <!-- Formulario con binding de Thymeleaf -->
                    <form th:action="@{/membresias/change-membresia}" th:object="${membresia}" method="post">
                        <!-- Campo oculto para el ID -->
                        <input type="hidden" th:field="*{id}" />
                        <!-- Campo oculto para propiedades que no están en el formulario. estatus -->
                        <input type="hidden" th:field="*{estatus}" />

                        <div th:if="${#fields.hasGlobalErrors()}" class='alert alert-danger' role="alert">
                            Verifique los siguientes inconvenientes
                            <ul>
                                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                            </ul>
                        </div>
                        <!-- Campo: Nombre -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Ingrese el nombre de la membresía" required />
                            <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>
                        <!-- Campo: Descripción -->
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea
                                    class="form-control"
                                    id="descripcion"
                                    th:field="*{descripcion}"
                                    rows="3"
                                    placeholder="Describa la membresía"
                                    required
                            ></textarea>
                            <div class="text-danger" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                        </div>
                        <!-- Campo: Tarifa -->
                        <div class="mb-3">
                            <label for="tarifa" class="form-label">Tarifa</label>
                            <input type="number" step="0.01" class="form-control" id="tarifa" th:field="*{tarifa}" placeholder="Ingrese la tarifa" required />
                            <div class="text-danger" th:if="${#fields.hasErrors('tarifa')}" th:errors="*{tarifa}"></div>
                        </div>
                        <!-- Campo: Duración en días -->
                        <div class="mb-3">
                            <label for="duracion_dias" class="form-label">Duración (días)</label>
                            <input type="number" class="form-control" id="duracion_dias" th:field="*{duracionDias}" placeholder="Ingrese la duración en días" required />
                            <div class="text-danger" th:if="${#fields.hasErrors('duracionDias')}" th:errors="*{duracionDias}"></div>
                        </div>
                        <!-- Botones de Acción -->
                        <div class="d-flex justify-content-end">
                            <a th:href="@{/membresias}" class="btn btn-secondary me-2">
                                <i class="bi bi-arrow-left-circle"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Actualizar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
</body>
</html>
