<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<!-- Contenido principal -->
<div class="container container-custom mt-4">

    <!-- Mensaje de éxito -->
    <div id="alertSuccess" th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Encabezado y Botón Nueva Membresía -->
    <div class="row align-items-center mb-4">
        <div class="col-md-6">
            <h2>Gestión de Membresías</h2>
        </div>
        <div class="col-md-6 text-end">
            <a class="btn btn-primary" th:href="@{/membresias/new}">
                <i class="bi bi-plus-circle"></i> Nueva Membresía
            </a>
        </div>
    </div>

    <!-- Tarjetas Resumen -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-title">Total Membresías</h6>
                    <p class="card-text" th:text="${totalMembresias}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-title">Activas</h6>
                    <p class="card-text" th:text="${membresiasActivas}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-title">Inactivas</h6>
                    <p class="card-text" th:text="${membresiasInactivas}"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Campo de Búsqueda -->
    <form th:action="@{/membresias}" method="get">
        <div class="row mb-3">
            <div class="col-md-6">
                <div class="input-group">
                    <input
                            type="text"
                            name="q"
                            class="form-control"
                            placeholder="Buscar membresía por nombre, tarifa, estatus, etc."
                            th:value="${q}"
                    />
                    <button class="btn btn-link" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </div>
        </div>
    </form>

    <!-- Tabla de Membresías -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead style="background-color: #e9f5ff; color: #0d6efd">
            <tr>
                <th>ID</th>
                <th>Nombre Tipo</th>
                <th>Tarifa</th>
                <th>Duración (días)</th>
                <th>Estatus</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="membresia : ${membresias}">
                <td th:text="${membresia.id}">1</td>
                <td th:text="${membresia.nombre}">Mensual</td>
                <td th:text="${membresia.tarifa}">$50.00</td>
                <td th:text="${membresia.duracionDias}">30</td>
                <td th:text="${membresia.estatus}">Activo</td>
                <td>
                    <a class="btn btn-outline-primary btn-sm"
                       th:href="@{'/membresias/get?id=' + ${membresia.id}}">
                        <i class="bi bi-eye"></i> Ver Detalle
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
<script>
    // Espera 5 segundos y oculta el alert automáticamente
    document.addEventListener("DOMContentLoaded", function () {
        var alertEl = document.getElementById("alertSuccess");
        if (alertEl) {
            setTimeout(function () {
                // Usa el metodo de Bootstrap para cerrar el alert
                var bsAlert = new bootstrap.Alert(alertEl);
                bsAlert.close();
            }, 5000);
        }
    });
</script>
</body>
</html>
