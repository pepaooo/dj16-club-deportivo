<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <div th:insert="~{plantillas/plantilla :: headContent}"></div>
    <link th:href="@{/select2/css/select2.min.css}" rel="stylesheet"/>
    <script th:src="@{/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/select2/js/select2.full.min.js}"></script>
</head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<!-- Contenido principal -->
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <!-- Encabezado del formulario -->
            <div class="text-center mb-4">
                <i class="bi bi-card-checklist" style="font-size: 3rem; color: #1976d2"></i>
                <h2 class="mt-2">Nueva Reserva</h2>
                <p class="text-muted">
                    Complete la información para registrar una nueva reserva de instalación.
                </p>
            </div>
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <!-- Formulario con binding de Thymeleaf -->

                    <!-- Para MIEMBRO -->
                    <div sec:authorize="!hasAnyAuthority('STAFF','ADMIN') and hasAuthority('MIEMBRO')">
                        <form th:action="@{/reservas/create-reserva}" th:object="${reservaDTO}" method="post">
                            <div th:if="${#fields.hasGlobalErrors()}" class='alert alert-danger' role="alert">
                                Verifique los siguientes inconvenientes
                                <ul>
                                    <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                                </ul>
                            </div>
                            <!-- 1) Miembro -->
                            <!-- ocultamos el select y ponemos su propio ID -->
                            <input type="hidden" th:field="*{idMiembro}" th:value="${currentMiembroId}"/>
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('idMiembro')}"
                                 th:errors="*{idMiembro}"></div>

                            <div class="mb-3">
                                <label class="form-label">Miembro</label>
                                <input type="text" class="form-control" readonly
                                       th:value="${currentMiembroNombre}"/>
                            </div>

                            <!-- 2) Membresía activa (sólo lectura) -->
                            <div th:if="${noMembership}" class="alert alert-warning">
                                No tienes ninguna membresía activa.
                            </div>
                            <div th:unless="${noMembership}">
                                <div class="mb-3">
                                    <label class="form-label">Membresía Activa</label>
                                    <input type="text" class="form-control" readonly
                                           th:value="${currentMembresiaName}"/>
                                </div>

                                <!-- 3) Instalación -->
                                <div class="mb-3">
                                    <label class="form-label">Instalación</label>
                                    <select th:field="*{idInstalacion}" class="form-control">
                                        <option value="">-- Seleccione --</option>
                                        <option th:each="inst : ${currentInstalaciones}"
                                                th:value="${inst.id}"
                                                th:text="${inst.nombre}"></option>
                                    </select>
                                    <div class="text-danger"
                                         th:if="${#fields.hasErrors('idInstalacion')}"
                                         th:errors="*{idInstalacion}"></div>
                                </div>

                                <!-- 4) Fecha / Hora Inicio -->
                                <div class="mb-3">
                                    <label for="fechaHoraInicio" class="form-label">Fecha y Hora de Inicio</label>
                                    <input
                                            type="datetime-local"
                                            class="form-control"
                                            id="fechaHoraInicio"
                                            th:field="*{fechaHoraInicio}"
                                            name="fechaHoraInicio"
                                            required
                                    />
                                    <div class="text-danger" th:if="${#fields.hasErrors('fechaHoraInicio')}"
                                         th:errors="*{fechaHoraInicio}"></div>
                                </div>

                                <!-- 5) Fecha / Hora Fin -->
                                <div class="mb-3">
                                    <label for="fechaHoraFin" class="form-label">Fecha y Hora de Fin</label>
                                    <input
                                            type="datetime-local"
                                            class="form-control"
                                            id="fechaHoraFin"
                                            th:field="*{fechaHoraFin}"
                                            name="fechaHoraFin"
                                            required
                                    />
                                    <div class="text-danger" th:if="${#fields.hasErrors('fechaHoraFin')}"
                                         th:errors="*{fechaHoraFin}"></div>
                                </div>

                                <!-- Botones de Acción -->
                                <div class="d-flex justify-content-end">
                                    <a th:href="@{/reservas}" class="btn btn-secondary me-2">
                                        <i class="bi bi-arrow-left-circle"></i> Cancelar
                                    </a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-check-circle"></i> Guardar
                                    </button>
                                </div>
                            </div>

                        </form>
                    </div>

                    <!-- Para ADMIN, GERENTE, etc. -->
                    <div sec:authorize="hasAnyAuthority('STAFF','ADMIN','GERENTE')">
                        <form th:action="@{/reservas/create-reserva}" th:object="${reservaDTO}" method="post">
                            <div th:if="${#fields.hasGlobalErrors()}" class='alert alert-danger' role="alert">
                                Verifique los siguientes inconvenientes
                                <ul>
                                    <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                                </ul>
                            </div>
                            <!-- 1) Miembro -->
                            <div class="mb-3">
                                <label for="miembroSelect" class="form-label">Miembro</label>
                                <select id="miembroSelect" name="idMiembro" th:field="*{idMiembro}" class="form-control"
                                        style="width: 100%;">
                                    <!-- Las opciones se cargarán vía AJAX -->
                                </select>
                                <div class="text-danger" th:if="${#fields.hasErrors('idMiembro')}"
                                     th:errors="*{idMiembro}"></div>
                            </div>

                            <!-- 2) Membresía activa (sólo lectura) -->
                            <div class="mb-3">
                                <label for="membresiaActiva" class="form-label">Membresía Activa</label>
                                <input type="text"
                                       id="membresiaActiva"
                                       class="form-control"
                                       readonly>
                            </div>

                            <!-- 3) Instalación -->
                            <div class="mb-3">
                                <label for="instalacionSelect" class="form-label">Instalación</label>
                                <select id="instalacionSelect" name="idInstalacion" th:field="*{idInstalacion}"
                                        class="form-control"
                                        style="width: 100%;">
                                    <!-- Las opciones se cargarán vía AJAX -->
                                </select>
                                <div class="text-danger" th:if="${#fields.hasErrors('idInstalacion')}"
                                     th:errors="*{idInstalacion}"></div>
                            </div>

                            <!-- 4) Fecha / Hora Inicio -->
                            <div class="mb-3">
                                <label for="fechaHoraInicio" class="form-label">Fecha y Hora de Inicio</label>
                                <input
                                        type="datetime-local"
                                        class="form-control"
                                        id="fechaHoraInicio"
                                        th:field="*{fechaHoraInicio}"
                                        name="fechaHoraInicio"
                                        required
                                />
                                <div class="text-danger" th:if="${#fields.hasErrors('fechaHoraInicio')}"
                                     th:errors="*{fechaHoraInicio}"></div>
                            </div>

                            <!-- 5) Fecha / Hora Fin -->
                            <div class="mb-3">
                                <label for="fechaHoraFin" class="form-label">Fecha y Hora de Fin</label>
                                <input
                                        type="datetime-local"
                                        class="form-control"
                                        id="fechaHoraFin"
                                        th:field="*{fechaHoraFin}"
                                        name="fechaHoraFin"
                                        required
                                />
                                <div class="text-danger" th:if="${#fields.hasErrors('fechaHoraFin')}"
                                     th:errors="*{fechaHoraFin}"></div>
                            </div>

                            <!-- Botones de Acción -->
                            <div class="d-flex justify-content-end">
                                <a th:href="@{/reservas}" class="btn btn-secondary me-2">
                                    <i class="bi bi-arrow-left-circle"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Guardar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{plantillas/plantilla :: footer}"></footer>

<script>

    $(document).ready(function () {

        $('#miembroSelect').select2({
            placeholder: 'Buscar miembro por nombre, correo, etc.',
            ajax: {
                url: '/api/miembros/search-active',
                dataType: 'json',
                delay: 250,
                data: function (params) {
                    return {q: params.term};
                },
                processResults: function (data) {
                    return {
                        results: $.map(data, function (item) {
                            return {
                                id: item.id,
                                text: item.nombre + ' ' + item.apellidoPaterno + ' ' + item.apellidoMaterno,
                                membershipId: item.membershipId,
                                membershipName: item.membershipName
                            };
                        })
                    };
                },
                cache: true
            },
            minimumInputLength: 1
        })
            .on('select2:select', e => {
                const sel = e.params.data;
                // 2) Muestro el nombre de la membresía
                $('#membresiaActiva').val(sel.membershipName);
                // 3) Cargo instalaciones válidas
                if (!sel.membershipId) return;
                $('#instalacionSelect').prop('disabled', true).empty()
                    .append('<option>Cargando…</option>');
                $.getJSON(`/api/membresias/${sel.membershipId}/instalaciones`, insts => {
                    const $s = $('#instalacionSelect').empty()
                        .append('<option value="">Seleccione una</option>');
                    insts.forEach(i => {
                        $s.append(`<option value="${i.id}">${i.nombre}</option>`);
                    });
                    $s.prop('disabled', false);
                });

            });

        // 4) Auto‑calcula +1h para fin
        $('#fechaHoraInicio').on('change', function () {
            const inicio = this.value;
            if (!inicio) return;
            const dt = new Date(inicio);
            dt.setHours(dt.getHours() + 1);
            const pad = n => n.toString().padStart(2, '0');
            const yyyy = dt.getFullYear(), mm = pad(dt.getMonth() + 1),
                dd = pad(dt.getDate()), hh = pad(dt.getHours()),
                mi = pad(dt.getMinutes());
            $('#fechaHoraFin').val(`${yyyy}-${mm}-${dd}T${hh}:${mi}`);
        });

    });
</script>

</body>
</html>
