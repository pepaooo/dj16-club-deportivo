<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>
<!-- Contenido principal -->
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Gestión de Reservas</h2>
        <a class="btn btn-custom" href="nueva-reserva.html">
            <i class="bi bi-plus-circle"></i> Nueva Reserva
        </a>
    </div>
    <!-- Tabla de Reservas -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Instalación</th>
                <th>Miembro</th>
                <th>Inicio</th>
                <th>Fin</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>1</td>
                <td>Cancha de Fútbol</td>
                <td>Juan Pérez</td>
                <td>2025-04-01 10:00</td>
                <td>2025-04-01 11:00</td>
                <td><span class="badge bg-info text-dark">Pendiente</span></td>
                <td>
                    <a
                            class="btn btn-custom-outline btn-sm"
                            href="confirmar-reserva.html?id=1"
                    >
                        <i class="bi bi-check-circle"></i> Confirmar
                    </a>
                    <a
                            class="btn btn-custom-danger-outline btn-sm"
                            href="cancelar-reserva.html?id=1"
                    >
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                </td>
            </tr>
            <!-- Más filas según sea necesario -->
            </tbody>
        </table>
    </div>
</div>
<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
</body>
</html>
