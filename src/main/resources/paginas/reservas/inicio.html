<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<!-- Contenido principal -->
<div class="container container-custom mt-4">
    <!-- Encabezado y Botón Nueva Reserva -->
    <div class="row align-items-center mb-4">
        <div class="col-md-6">
            <h2>Gestión de Reservas</h2>
        </div>
        <div class="col-md-6 text-end">
            <a class="btn btn-primary" th:href="@{/reservas/new}">
                <i class="bi bi-plus-circle"></i> Nueva Reserva
            </a>
        </div>
    </div>

    <!-- Tarjetas resumen (opcional) -->
    <div class="row row-cols-1 row-cols-md-4 mb-4">
        <div class="col">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-title">Total Reservas</h6>
                    <p class="card-text" th:text="${totalReservas}"></p>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-title">Pendientes</h6>
                    <p class="card-text" th:text="${reservasPendientes}"></p>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-title">Confirmadas</h6>
                    <p class="card-text" th:text="${reservasConfirmadas}"></p>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-title">Canceladas</h6>
                    <p class="card-text" th:text="${reservasCanceladas}"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Campo de búsqueda -->
    <form th:action="@{/reservas}" method="get">
        <div class="input-group mb-3">
          <span class="input-group-text" id="search-addon"
          ><i class="bi bi-search"></i
          ></span>
            <input
                    type="text"
                    name="q"
                    class="form-control"
                    placeholder="Buscar reserva por miembro, instalación o fecha"
                    th:value="${q}"
                    aria-label="Buscar"
                    aria-describedby="search-addon"
            />
            <button class="btn btn-primary" type="submit">
                <i class="bi bi-search"></i> Buscar
            </button>
            <button id="clearBtn" type="button" class="btn btn-outline-secondary">
                <i class="bi bi-x-circle"></i> Limpiar
            </button>
        </div>
    </form>

    <!-- Tabla de Reservas -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead style="background-color: #e9f5ff; color: #0d6efd">
            <tr>
                <th>ID</th>
                <th>Miembro</th>
                <th>Instalación</th>
                <th>Inicio</th>
                <th>Fin</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <!-- Ejemplo de fila (en producción se iteraría con th:each) -->
            <tr th:each="reserva : ${reservas}">
                <td th:text="${reserva.id}"></td>
                <td th:text="${reserva.miembro.nombre}"></td>
                <td th:text="${reserva.instalacion.nombre}"></td>
                <td th:text="${#temporals.format(reserva.fechaHoraInicio, 'yyyy-MM-dd')}"></td>
                <td th:text="${#temporals.format(reserva.fechaHoraFin, 'yyyy-MM-dd')}"></td>
                <td th:text="${reserva.estadoReserva}"></td>
                <td>
                    <a class="btn btn-outline-primary btn-sm"
                       th:href="@{'/reservas/get?id=' + ${reserva.id}}">
                        <i class="bi bi-eye"></i> Ver Detalle
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(reservas)}">
                <td colspan="5" class="text-center">
                    No se encontraron registros.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
</body>
</html>
