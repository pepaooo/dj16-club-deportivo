<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<!-- Contenido principal -->
<div class="container container-custom mt-4">

    <!-- Mensaje de éxito -->
    <div id="alertSuccess" th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Encabezado y Botón Nueva Reserva -->
    <div class="row align-items-center mb-4">
        <div class="col-md-6">
            <h2>Gestión de Reservas</h2>
        </div>
        <div class="col-md-6 text-end">
            <a class="btn btn-primary" th:href="@{/reservas/new}">
                <i class="bi bi-plus-circle"></i> Nueva Reserva
            </a>
        </div>
    </div>

    <!-- Tarjetas resumen (opcional) -->
    <div class="row row-cols-1 row-cols-md-4 mb-4">
        <div class="col">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-title">Total Reservas</h6>
                    <p class="card-text" th:text="${totalReservas}"></p>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-title">Pendientes</h6>
                    <p class="card-text" th:text="${reservasPendientes}"></p>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-title">Confirmadas</h6>
                    <p class="card-text" th:text="${reservasConfirmadas}"></p>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-title">Canceladas</h6>
                    <p class="card-text" th:text="${reservasCanceladas}"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Campo de búsqueda -->
    <form id="searchForm" th:action="@{/reservas}" method="get">
        <div class="row mb-3">
            <div class="col-md-8 offset-md-2">
                <div class="input-group">
                    <input type="text" id="searchInput" name="q" class="form-control"
                           placeholder="Buscar reserva por miembro, instalación o fecha" th:value="${q}"
                           aria-label="Buscar"
                           aria-describedby="search-addon"/>
                    <button class="btn btn-primary" type="submit">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                    <!-- Botón de limpiar, inicialmente oculto -->
                    <button type="button" id="clearSearch" class="btn btn-outline-secondary" style="display: none;">
                        <i class="bi bi-x"></i> Limpiar
                    </button>
                </div>
            </div>
        </div>
    </form>

    <!-- Tabla de Reservas -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead style="background-color: #e9f5ff; color: #0d6efd">
            <tr>
                <th>ID</th>
                <th>Miembro</th>
                <th>Instalación</th>
                <th>Inicio</th>
                <th>Fin</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <!-- Ejemplo de fila (en producción se iteraría con th:each) -->
            <tr th:each="reserva : ${reservas}">
                <td th:text="${reserva.id}"></td>
                <td th:text="${reserva.miembro.nombre + ' ' + reserva.miembro.apellidoPaterno + ' ' + reserva.miembro.apellidoMaterno}"></td>
                <td th:text="${reserva.instalacion.nombre}"></td>
                <td th:text="${#temporals.format(reserva.fechaHoraInicio, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${#temporals.format(reserva.fechaHoraFin, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${reserva.estadoReserva}"></td>
                <td>
                    <a class="btn btn-outline-primary btn-sm"
                       th:href="@{'/reservas/get?id=' + ${reserva.id}}">
                        <i class="bi bi-eye"></i> Ver Detalle
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(reservas)}">
                <td colspan="7" class="text-center">
                    No se encontraron registros.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
<script>
    // Espera 5 segundos y oculta el alert automáticamente
    document.addEventListener("DOMContentLoaded", function () {
        var alertEl = document.getElementById("alertSuccess");
        if (alertEl) {
            setTimeout(function () {
                // Usa el metodo de Bootstrap para cerrar el alert
                var bsAlert = new bootstrap.Alert(alertEl);
                bsAlert.close();
            }, 5000);
        }
    });
    // Muestra el botón de limpiar si hay texto en el campo de búsqueda
    document.addEventListener("DOMContentLoaded", function () {
        const searchInput = document.getElementById("searchInput");
        const clearButton = document.getElementById("clearSearch");
        const searchForm = document.getElementById("searchForm");

        // Mostrar botón de limpiar si el campo tiene contenido al cargar la página
        if (searchInput.value.trim() !== "") {
            clearButton.style.display = "inline-block";
        }

        // Actualizar visibilidad del botón a medida que se escribe
        searchInput.addEventListener("input", function () {
            clearButton.style.display = this.value.trim() !== "" ? "inline-block" : "none";
        });

        // Al hacer clic en "Limpiar", se borra el campo y se envía el formulario sin filtro
        clearButton.addEventListener("click", function () {
            searchInput.value = "";
            searchForm.submit();
        });
    });
</script>
</body>
</html>
