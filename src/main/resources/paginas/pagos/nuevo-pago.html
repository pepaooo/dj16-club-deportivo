<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <div th:insert="~{plantillas/plantilla :: headContent}"></div>
    <link th:href="@{/select2/css/select2.min.css}" rel="stylesheet"/>
    <script th:src="@{/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/select2/js/select2.full.min.js}"></script>
</head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<!-- Contenido Principal -->
<div class="container container-custom mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <!-- Encabezado del formulario -->
            <div class="text-center mb-4">
                <i
                        class="bi bi-cash-stack"
                        style="font-size: 3rem; color: #1976d2"
                ></i>
                <h2 class="mt-2">Realizar Pago de Membresía</h2>
                <p class="text-muted">
                    Complete la información para registrar el pago de la membresía.
                </p>
            </div>
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <form id="pagoForm" th:action="@{/pagos/create-pago}" th:object="${pagoDTO}" method="post">

                        <!-- Mostrar errores globales -->
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
                            Verifique los siguientes inconvenientes:
                            <ul>
                                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                            </ul>
                        </div>

                        <!-- Selección de Miembro -->
                        <div class="mb-3">
                            <label for="miembroSelect" class="form-label">Miembro</label>
                            <select id="miembroSelect" name="idMiembro" th:field="*{idMiembro}" class="form-control"
                                    style="width: 100%;">
                                <!-- Las opciones se cargarán vía AJAX -->
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('idMiembro')}"
                                 th:errors="*{idMiembro}"></div>
                        </div>

                        <!-- Historial contextual, oculto hasta elegir miembro -->
                        <div id="miembro-contexto" class="mb-4" style="display:none">
                            <h6>Historial de Membresías</h6>
                            <div class="table-responsive">
                                <table class="table table-sm">
                                    <thead>
                                    <tr>
                                        <th>Tipo</th>
                                        <th>Inicio</th>
                                        <th>Fin</th>
                                        <th>Estatus</th>
                                    </tr>
                                    </thead>
                                    <tbody id="tabla-pagos-miembro">
                                    <!-- se llena vía JS -->
                                    <tr id="sin-pagos">
                                        <td colspan="4" class="text-center text-muted">No hay membresías registradas
                                            aún
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Selección de Plan (nueva/renovación/cambio) -->
                        <div class="mb-3">
                            <label for="tipoMembresia" class="form-label">Tipo de Membresía</label>
                            <select id="tipoMembresia" th:field="*{membresiaId}" class="form-select">
                                <option value="">Seleccione un tipo</option>
                                <option th:each="tm : ${tiposMembresia}"
                                        th:value="${tm.id}"
                                        th:text="${tm.nombre}"
                                        th:selected="${tm.id} == ${pagoDTO.membresiaId}"></option>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('membresiaId')}"
                                 th:errors="*{membresiaId}"></div>
                        </div>

                        <!-- Monto calculado / editable -->
                        <div class="mb-3">
                            <label for="monto" class="form-label">Monto</label>
                            <div class="input-group mb-3">
                                <span class="input-group-text">$</span>
                                <input
                                        type="number" step="0.01"
                                        th:field="*{monto}"
                                        id="monto"
                                        class="form-control"
                                        placeholder="0.00"
                                        required
                                />
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('monto')}"
                                 th:errors="*{monto}"></div>
                        </div>

                        <!-- Fecha de Inicio -->
                        <div class="mb-3">
                            <label for="fechaInicio" class="form-label">Fecha de Inicio</label>
                            <input
                                    type="date"
                                    class="form-control"
                                    id="fechaInicio"
                                    name="fechaInicio"
                                    th:field="*{fechaInicio}"
                                    required
                            />
                            <div class="text-danger" th:if="${#fields.hasErrors('fechaInicio')}"
                                 th:errors="*{fechaInicio}"></div>
                        </div>

                        <!-- Duración -->
                        <div class="mb-3">
                            <label for="duracion" class="form-label">Duración</label>
                            <input type="text"
                                   id="duracion"
                                   class="form-control"
                                   readonly/>
                        </div>

                        <!-- Fecha de Fin -->
                        <div class="mb-3">
                            <label for="fechaFin" class="form-label">Fecha Fin</label>
                            <input type="date"
                                   id="fechaFin"
                                   class="form-control"
                                   readonly/>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex justify-content-end">
                            <a th:href="@{/pagos}" class="btn btn-secondary me-2">
                                <i class="bi bi-arrow-left-circle"></i> Cancelar
                            </a>
                            <button id="btnAbrirModal" type="button" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Registrar Pago
                            </button>
                        </div>

                        <!-- Modal de Confirmación -->
                        <div class="modal fade" id="confirmPagoModal" tabindex="-1"
                             aria-labelledby="confirmPagoLabel" aria-hidden="true">
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content rounded-3 shadow">
                                    <div class="modal-header bg-primary text-white border-0 rounded-top">
                                        <h5 class="modal-title" id="confirmPagoLabel">
                                            <i class="bi bi-credit-card-2-front-fill me-2"></i> Confirmar Pago
                                        </h5>
                                        <button type="button" class="btn-close btn-close-white"
                                                data-bs-dismiss="modal"
                                                aria-label="Cerrar"></button>
                                    </div>
                                    <div class="modal-body">
                                        <p class="fs-6">
                                            ¿Seguro que deseas registrar el pago de
                                            <strong id="modalMonto">0.00</strong> MXN?
                                        </p>
                                    </div>
                                    <div class="modal-footer border-0">
                                        <button type="button" class="btn btn-outline-secondary"
                                                data-bs-dismiss="modal">
                                            <i class="bi bi-x-circle"></i> Cancelar
                                        </button>
                                        <!-- Este botón dispara el submit del form sin código extra -->
                                        <button type="submit" form="pagoForm" class="btn btn-primary">
                                            <i class="bi bi-check-circle-fill"></i> Sí, registrar
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


<footer th:replace="~{plantillas/plantilla :: footer}"></footer>

<script>

    $(document).ready(function () {
        let defaultFin = null;

        // 1) Configuramos Select2 para buscar sólo miembros activos
        $('#miembroSelect').select2({
            placeholder: 'Buscar miembro por nombre, correo, etc.',
            ajax: {
                url: '/api/miembros/search',
                dataType: 'json',
                delay: 250,
                data: function (params) {
                    return {q: params.term};
                },
                processResults: function (data) {
                    return {
                        results: $.map(data, function (item) {
                            return {
                                id: item.id,
                                text: item.nombre + ' ' + item.apellidoPaterno + ' ' + item.apellidoMaterno
                            };
                        })
                    };
                },
                cache: true
            },
            minimumInputLength: 1
        })
            .on('select2:select', e => {
                const miembroId = e.params.data.id;
                // Ocultamos/mostramos el panel de contexto
                $('#miembro-contexto').show();
                // Limpiamos la tabla ANTES de cargar datos
                $('#tabla-pagos-miembro').empty();
                // 2) resetear selects e inputs
                $('#tipoMembresia').val('').trigger('change');
                $('#monto, #duracion, #fechaInicio, #fechaFin').val('');
                $('#fechaInicio').prop('readonly', false);
                // Trae pagos ordenados por fechaInicio DESC
                $.getJSON(`/api/pagos/miembro/${miembroId}`, pagos => {
                    const $tb = $('#tabla-pagos-miembro');
                    // a) quita el mensaje “sin registros”
                    $tb.find('#sin-pagos').remove();
                    // b) si no hay pagos, vuelve a poner fila
                    if (pagos.length === 0) {
                        $tb.append(`
                          <tr id="sin-pagos">
                            <td colspan="4" class="text-center text-muted">
                              No hay membresías registradas aún
                            </td>
                          </tr>
                        `);
                    }
                    // c) si hay pagos, dibújalos
                    pagos.forEach(p => $tb.append(`
                    <tr>
                      <td>${p.membresiaActual}</td>
                      <td>${p.fechaInicio}</td>
                      <td>${p.fechaFin}</td>
                      <td>${p.estatusMembresia}</td>
                    </tr>
                  `));
                    // Inferimos «operación» y pre‑configuramos campos:
                    const ultimo = pagos[0];
                    if (ultimo) {
                        $('#tipoMembresia').val(ultimo.idMembresiaActual);
                        if (ultimo.estatusMembresia === 'Activo') {
                            defaultFin = new Date(ultimo.fechaFin);
                            defaultFin.setDate(defaultFin.getDate() + 1);
                            $('#fechaInicio').val(defaultFin.toISOString().slice(0, 10))
                                .prop('readonly', false);
                        }
                    }
                    // Disparamos el change para poblar el monto correcto de la membresía
                    $('#tipoMembresia').trigger('change');

                });
            });

        // cada vez que cambie el plan en el select:
        $('#tipoMembresia').on('change', function () {
            const planId = $(this).val();
            if (!planId) {
                $('#monto').val('');
                return;
            }
            $.ajax({
                url: `/api/membresias/${planId}`,
                dataType: 'json',
                success: function (data) {
                    // 1) tarifa
                    $('#monto').val(data.tarifa);
                    // 2) duración
                    $('#duracion').val(data.duracionDias + ' días');
                    // 3) si ya hay fechaInicio, recalcula fechaFin
                    const inicio = $('#fechaInicio').val();
                    if (inicio) {
                        const dt = new Date(inicio);
                        dt.setDate(dt.getDate() + data.duracionDias);
                        // yyyy‑mm‑dd
                        $('#fechaFin').val(dt.toISOString().slice(0, 10));
                    }
                },
                error: function () {
                    console.error('Error al obtener la tarifa del plan');
                }
            });
        });

        // Y también al cambiar manualmente la fechaInicio…
        $('#fechaInicio').on('change', function () {
            const inicio = this.value;
            const durText = $('#duracion').val();
            if (inicio && durText) {
                const dias = parseInt(durText, 10);
                const dt = new Date(inicio);
                dt.setDate(dt.getDate() + dias);
                $('#fechaFin').val(dt.toISOString().slice(0, 10));
            }
        });

        // Cuando se vaya a mostrar el modal…
        $('#confirmPagoModal').on('show.bs.modal', function () {
            // Leer el valor actual del campo monto y formatearlo a 2 decimales
            let raw = $('#monto').val() || '0';
            let num = parseFloat(raw);
            let texto = num.toLocaleString('es-MX', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            // Inyectarlo en el <strong id="modalMonto">
            $('#modalMonto').text(texto);
        });

        // Botón “Registrar Pago” validará antes de abrir el modal
        $('#btnAbrirModal').on('click', function() {
            var form = document.getElementById('pagoForm');
            if (form.checkValidity()) {
                // Si todo ok, muestra el modal
                new bootstrap.Modal(document.getElementById('confirmPagoModal')).show();
            } else {
                // Si hay campos invalidos, muestra mensajes nativos
                form.reportValidity();
            }
        });

    });

</script>

</body>
</html>
