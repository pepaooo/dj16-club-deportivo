<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <div th:insert="~{plantillas/plantilla :: headContent}"></div>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
</head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<!-- Contenido Principal -->
<div class="container container-custom mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <!-- Encabezado del formulario -->
            <div class="text-center mb-4">
                <i
                        class="bi bi-cash-stack"
                        style="font-size: 3rem; color: #1976d2"
                ></i>
                <h2 class="mt-2">Realizar Pago de Membresía</h2>
                <p class="text-muted">
                    Complete la información para registrar el pago de la membresía.
                </p>
            </div>
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <form th:action="@{/pagos/create-pago}" th:object="${pagoDto}" method="post">

                        <!-- Mostrar errores globales -->
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
                            Verifique los siguientes inconvenientes:
                            <ul>
                                <li th:each="err : ${#fields.globalErrors()}" th:text="${err.defaultMessage}"></li>
                            </ul>
                        </div>

                        <!-- Campo para seleccionar Miembro -->
                        <div class="mb-3">
                            <label for="miembroSelect" class="form-label">Miembro</label>
                            <select id="miembroSelect" name="idMiembro" th:field="*{idMiembro}" class="form-control"
                                    style="width: 100%;">
                                <!-- Las opciones se cargarán vía AJAX -->
                            </select>
                        </div>

                        <!-- Selector de Operación -->
                        <div class="mb-3">
                            <label class="form-label">Operación</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{operacion}" value="RENOVAR"
                                       id="renovarRadio"/>
                                <label class="form-check-label" for="renovarRadio">Renovar</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" th:field="*{operacion}" value="CAMBIAR"
                                       id="cambiarRadio"/>
                                <label class="form-check-label" for="cambiarRadio">Cambiar Membresía</label>
                            </div>
                        </div>

                        <!-- Campo para la membresía actual (solo lectura) -->
<!--                        <div class="mb-3">-->
<!--                            <label for="membresiaActual" class="form-label">Membresía Actual</label>-->
<!--                            <input type="text" class="form-control" id="membresiaActual" readonly />-->
<!--                        </div>-->
<!--                        &lt;!&ndash; Campo para la tarifa (solo lectura) &ndash;&gt;-->
<!--                        <div class="mb-3">-->
<!--                            <label for="tarifa" class="form-label">Tarifa</label>-->
<!--                            <input type="number" step="0.01" class="form-control" id="tarifa" readonly />-->
<!--                        </div>-->

                        <!-- Contenedor para seleccionar el nuevo tipo de membresía -->
                        <div class="mb-3" id="nuevoTipoContainer" style="display: none;">
                            <label for="nuevoTipo" class="form-label">Nuevo Tipo de Membresía</label>
                            <select id="nuevoTipo" th:field="*{nuevoTipoMembresiaId}" class="form-select" required>
                                <option value="">Seleccione un tipo</option>
                                <option th:each="tm : ${tiposMembresia}" th:value="${tm.id}"
                                        th:text="${tm.nombre}"></option>
                            </select>
                        </div>

                        <!-- Campo para el monto del pago -->
                        <div class="mb-3">
                            <label for="monto" class="form-label">Monto</label>
                            <!-- El campo se pondrá en modo lectura si se selecciona "RENOVAR" -->
                            <input type="number" step="0.01" th:field="*{monto}" id="monto" class="form-control"
                                   required/>
                        </div>

                        <!-- Fecha de Inicio de Membresía sin horas -->
                        <div class="mb-3">
                            <label for="fechaInicio" class="form-label"
                            >Fecha de Inicio de Membresía</label
                            >
                            <input
                                    type="date"
                                    class="form-control"
                                    id="fechaInicio"
                                    name="fechaInicio"
                                    th:field="*{fechaInicio}"
                                    required
                            />
                        </div>
                        <div class="d-flex justify-content-end">
                            <a th:href="@{/pagos}" class="btn btn-secondary me-2">
                                <i class="bi bi-arrow-left-circle"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Registrar Pago
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{plantillas/plantilla :: footer}"></footer>

<script>

    var defaultTarifa = null; // Variable para guardar la tarifa inicial

    $(document).ready(function () {
        $('#miembroSelect').select2({
            placeholder: 'Buscar miembro por nombre, correo, etc.',
            ajax: {
                url: '/miembros/search', // Endpoint REST configurado
                dataType: 'json',
                delay: 250,
                data: function (params) {
                    return {
                        q: params.term // Término de búsqueda
                    };
                },
                processResults: function (data) {
                    // Mapear la respuesta a formato select2
                    return {
                        results: $.map(data, function (item) {
                            return {
                                id: item.id,
                                text: item.nombre + ' ' + item.apellidoPaterno + ' ' + item.apellidoMaterno
                            };
                        })
                    };
                },
                cache: true
            },
            minimumInputLength: 1
        });

        // Cuando se seleccione un miembro, hacer una llamada AJAX para obtener más datos.
        $('#miembroSelect').on('select2:select', function (e) {
            var data = e.params.data;
            var miembroId = data.id;
            $.ajax({
                url: '/miembros/detail',
                data: {id: miembroId},
                dataType: 'json',
                success: function (response) {
                    // Guardamos la tarifa predeterminada
                    defaultTarifa = response.tarifa;
                    // Selecciona automáticamente "RENOVAR"
                    $("input[name='operacion'][value='RENOVAR']").prop('checked', true);
                    // Oculta el contenedor para nuevo tipo de membresía
                    $("#nuevoTipoContainer").hide();
                    $("#monto").prop("readonly", true);
                    // Actualiza el campo monto con la tarifa del plan actual
                    $("#monto").val(response.tarifa);
                },
                error: function () {
                    console.error('Error al obtener los datos del miembro');
                }
            });
        });

        // Al cambiar la operación entre "CAMBIAR" y "RENOVAR"
        $("input[name='operacion']").change(function() {
            var operacion = $(this).val();
            if (operacion === "CAMBIAR") {
                $("#nuevoTipoContainer").show();
                $("#monto").prop("readonly", false);
                // Resetear el combo a la opción por defecto y limpiar el campo monto
                $('#nuevoTipo').val('').trigger('change');
                $("#monto").val('');
            } else if (operacion === "RENOVAR") {
                $("#nuevoTipoContainer").hide();
                $("#monto").prop("readonly", true);
                // Restaura el valor inicial si existe
                if (defaultTarifa !== null) {
                    $("#monto").val(defaultTarifa);
                }
            }
        });

        // Cuando se selecciona un nuevo tipo de membresía (para la operación "CAMBIAR")
        $('#nuevoTipo').change(function() {
            var nuevoTipoId = $(this).val();
            if (nuevoTipoId) {
                $.ajax({
                    url: '/membresias/tarifa', // Endpoint que retorna la tarifa para el nuevo tipo de membresía
                    data: { id: nuevoTipoId },
                    dataType: 'json',
                    success: function(data) {
                        $("#monto").val(data.tarifa);
                    },
                    error: function() {
                        console.error('Error al obtener la tarifa del nuevo plan');
                    }
                });
            } else {
                $("#monto").val('');
            }
        });

    });
</script>

</body>
</html>
