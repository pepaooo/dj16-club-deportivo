<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<!-- Contenido Principal -->
<div class="container container-custom-details mt-4">
    <!-- Encabezado general -->
    <div class="row justify-content-center mb-4">
        <div class="col-12 text-center">
            <i class="bi bi-receipt" style="font-size: 3rem; color: #1976d2"></i>
            <h2 class="mt-2">Detalles del Pago</h2>
        </div>
    </div>

    <!-- Sección de detalles del pago en dos columnas -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <!-- Columna Izquierda -->
                <div class="col-md-6">
                    <p>
                        <strong>ID:</strong>
                        <span th:text="${pago.id}"></span>
                    </p>
                    <p>
                        <strong>Miembro:</strong>
                        <span th:text="${pago.miembro.nombre} + ' ' + ${pago.miembro.apellidoPaterno} + ' ' + ${pago.miembro.apellidoMaterno}"></span>
                    </p>
                    <p>
                        <strong>Membresía:</strong>
                        <span th:text="${pago.membresia.nombre}"></span>
                    </p>
                    <p>
                        <strong>Monto:</strong> $<span th:text="${pago.monto}"></span>
                    </p>
                    <p>
                        <strong>Estatus:</strong>
                        <span th:text="${pago.estatus}"></span>
                    </p>
                </div>
                <!-- Columna Derecha -->
                <div class="col-md-6">
                    <p>
                        <strong>Fecha de Pago:</strong>
                        <span th:text="${#temporals.format(pago.fechaPago, 'yyyy-MM-dd HH:mm')}"></span>
                    </p>
                    <p>
                        <strong>Fecha de Inicio:</strong>
                        <span th:text="${#temporals.format(pago.fechaInicio, 'yyyy-MM-dd')}"></span>
                    </p>
                    <p>
                        <strong>Fecha Fin:</strong>
                        <span th:text="${#temporals.format(pago.fechaFin, 'yyyy-MM-dd')}"></span>
                    </p>
                    <p>
                        <strong>Registrado por:</strong>
                        <span th:text="${pago.registradoPor.nombre}"></span>
                    </p>
                </div>
            </div>
        </div>
        <div class="card-footer text-end">
            <a class="btn btn-secondary" th:href="@{${origen}=='miembro' ? '/pagos/historial-pagos?id=' + ${pago.miembro.id} : '/pagos'}">
                <i class="bi bi-arrow-left-circle"></i> Volver
            </a>
            <a class="btn btn-warning"
               th:if="${pago.estatus == 'Activo'}"
               th:href="@{'/pagos/change?id=' + ${pago.id}}">
                <i class="bi bi-pencil-square"></i> Ajustar
            </a>
        </div>
    </div>

    <!-- Historial de Ajustes -->
    <div class="card">
        <div class="card-header">
            <h4>Historial de Ajustes</h4>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead style="background-color: #e9f5ff; color: #0d6efd">
                    <tr>
                        <th>ID</th>
                        <th>Monto Ajuste</th>
                        <th>Fecha Ajuste</th>
                        <th>Registrado por</th>
                        <th>Descripción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ajuste : ${ajustes}">
                        <td th:text="${ajuste.id}"></td>
                        <td th:text="${ajuste.montoAjuste}"></td>
                        <td
                                th:text="${#temporals.format(ajuste.fechaAjuste, 'yyyy-MM-dd HH:mm')}">
                        </td>
                        <td th:text="${ajuste.registradoPor.nombre}">Usuario2</td>
                        <td th:text="${ajuste.descripcion}">
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ajustes)}">
                        <td colspan="5" class="text-center">
                            No se han registrado ajustes para este pago.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
</body>
</html>
