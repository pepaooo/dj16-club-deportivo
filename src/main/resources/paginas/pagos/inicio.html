<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head th:replace="~{plantillas/plantilla :: head}"></head>
<body>
<header th:replace="~{plantillas/plantilla :: header}"></header>

<!-- Contenido principal -->
<div class="container container-custom mt-4">

    <!-- Mensaje de éxito -->
    <div id="alertSuccess" th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <!-- Mensaje de error -->
    <div id="alertError" th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>


    <!-- Encabezado y botón Nuevo Miembro -->
    <div class="row align-items-center mb-4">
        <div class="col-md-6">
            <h2>Resumen de Pagos de Membresía</h2>
        </div>
        <div class="col-md-6 text-end">
            <a class="btn btn-primary" th:href="@{/pagos/new}">
                <i class="bi bi-plus-circle"></i> Nuevo Pago
            </a>
        </div>
    </div>

    <!-- Tarjetas Resumen -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-title">Total de Pagos de Membresía</h6>
                    <p class="card-text" th:text="${totalDePagos}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-title">Pagos de Membresía Vigentes</h6>
                    <p class="card-text" th:text="${pagosActivos}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h6 class="card-title">Pagos de Membresía Programados</h6>
                    <p class="card-text" th:text="${pagosProgramados}"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Campo de Búsqueda -->
    <form id="searchForm" th:action="@{/pagos}" method="get">
        <div class="row mb-3">
            <div class="col-md-8 offset-md-2">
                <div class="input-group">
                    <input type="text" id="searchInput" name="q" class="form-control"
                           placeholder="Buscar pago por miembro, fecha, etc." th:value="${q}" aria-label="Buscar"
                           aria-describedby="search-addon"/>
                    <button class="btn btn-primary" type="submit">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                    <!-- Botón de limpiar, inicialmente oculto -->
                    <button type="button" id="clearSearch" class="btn btn-outline-secondary" style="display: none;">
                        <i class="bi bi-x"></i> Limpiar
                    </button>
                </div>
            </div>
        </div>
    </form>

    <!-- Tabla de Pagos -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead style="background-color: #e9f5ff; color: #0d6efd">
            <tr>
                <th>Pago</th>
                <th>ID Miembro</th>
                <th>Miembro</th>
                <th>Membresía</th>
                <th>Monto</th>
                <th>Fecha inicio</th>
                <th>Fecha fin</th>
                <th>Estatus</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pago : ${pagosMembresiaDTO}">
                <td th:text="${pago.id}"></td>
                <td th:text="${pago.idMiembro}"></td>
                <td th:text="${pago.nombreMiembro + ' ' + pago.apPaternoMiembro + ' ' + pago.apMaternoMiembro}"></td>
                <td th:text="${pago.membresiaActual}"></td>
                <td>$<span th:text="${pago.monto}"></span></td>
                <td th:text="${pago.fechaInicio}"></td>
                <td th:text="${pago.fechaFin}"></td>
                <td th:text="${pago.estatusMembresia}"></td>
                <td>
                    <a class="btn btn-outline-primary btn-sm"
                       th:href="@{'/pagos/get?id=' + ${pago.id}}">
                        <i class="bi bi-eye"></i> Ver Detalle
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pagosMembresiaDTO)}">
                <td colspan="8" class="text-center">
                    No se encontraron registros.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
<script>
    // Espera 5 segundos y oculta el alert automáticamente
    document.addEventListener("DOMContentLoaded", function () {
        var alertEl = document.getElementById("alertSuccess");
        if (alertEl) {
            setTimeout(function () {
                // Usa el metodo de Bootstrap para cerrar el alert
                var bsAlert = new bootstrap.Alert(alertEl);
                bsAlert.close();
            }, 5000);
        }
        var alertErrorEl = document.getElementById("alertError");
        if (alertErrorEl) {
            setTimeout(function () {
                // Usa el metodo de Bootstrap para cerrar el alert
                var bsAlert = new bootstrap.Alert(alertErrorEl);
                bsAlert.close();
            }, 5000);
        }
    });
    // Muestra el botón de limpiar si hay texto en el campo de búsqueda
    document.addEventListener("DOMContentLoaded", function () {
        const searchInput = document.getElementById("searchInput");
        const clearButton = document.getElementById("clearSearch");
        const searchForm = document.getElementById("searchForm");

        // Mostrar botón de limpiar si el campo tiene contenido al cargar la página
        if (searchInput.value.trim() !== "") {
            clearButton.style.display = "inline-block";
        }

        // Actualizar visibilidad del botón a medida que se escribe
        searchInput.addEventListener("input", function () {
            clearButton.style.display = this.value.trim() !== "" ? "inline-block" : "none";
        });

        // Al hacer clic en "Limpiar", se borra el campo y se envía el formulario sin filtro
        clearButton.addEventListener("click", function () {
            searchInput.value = "";
            searchForm.submit();
        });
    });
</script>
</body>
</html>
