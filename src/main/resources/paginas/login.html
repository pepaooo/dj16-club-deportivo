<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head>
    <div th:insert="~{plantillas/plantilla :: head}"></div>
    <title>Iniciar Sesión - SGCD</title>
    <style>
        /* Estilos específicos para la página de login */
        body {
            background-color: #f5f5f5;
        }
        .login-container {
            max-width: 400px; /* Ancho ajustado */
            margin: 3rem auto; /* Menor margen vertical */
            padding: 2rem;
            background: #fff;
            border-radius: 0.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .login-container h2 {
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
<!--<header th:replace="~{plantillas/plantilla :: header}"></header>-->
<!-- Contenido principal -->
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="login-container">
            <h2 class="text-center">Iniciar Sesión</h2>

            <!-- Mensaje de error: se mostrará si en la URL se incluye ?error -->
            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                Usuario o contraseña incorrectos.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            placeholder="Ingrese su usuario"
                            required
                    />
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Ingrese su contraseña"
                            required
                    />
                </div>
                <!-- recordarme + olvidar -->
<!--                <div class="d-flex justify-content-between align-items-center mb-4">-->
<!--                    <div class="form-check">-->
<!--                        <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me">-->
<!--                        <label class="form-check-label" for="rememberMe">Recuérdame</label>-->
<!--                    </div>-->
<!--                    <a class="small" th:href="@{/forgot-password}">Olvidé mi contraseña</a>-->
<!--                </div>-->
                <!-- botón -->
                <div class="d-flex justify-content-center">
                    <button type="submit" class="btn btn-primary px-5">
                        <i class="bi me-1"></i> Ingresar
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
</body>
</html>
