<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <div th:insert="~{plantillas/plantilla :: head}"></div>
    <title>Iniciar Sesión - SGCD</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
        }

        .login-split {
            display: flex;
            height: 100vh;
        }

        .login-image {
            flex: 1;
            background: url('/images/edgar-chaparro-_T-D4Bb-H88-unsplash.jpg') center/cover no-repeat;
        }

        .login-form-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
        }

        .panel-inner {
            width: 100%;
            max-width: 360px;
            padding: 2rem;
            background: #fff;
            border-radius: .5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
    </style>
</head>
<body>
<div class="login-split">
    <div class="login-image"></div>
    <div class="login-form-panel">
        <div class="panel-inner">
            <h3 class="display-7 fw-bold mb-4">
                <i class="bi bi-speedometer2"></i> SGCD
            </h3>
            <h3 class="mb-4">Iniciar Sesión</h3>
            <!-- Credenciales incorrectas -->
            <div th:if="${param.error}" class="alert alert-danger">
                Usuario o contraseña incorrectos.
            </div>

            <!-- Cuenta inhabilitada -->
            <div th:if="${param.disabled}" class="alert alert-warning">
                Su cuenta está inhabilitada. Por favor contacte al administrador.
            </div>

            <!-- Cuenta bloqueada -->
            <div th:if="${param.locked}" class="alert alert-warning">
                Su cuenta está bloqueada. Por favor contacte al administrador.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-floating mb-3">
                    <input type="text" id="username" name="username" class="form-control"
                           placeholder="Ingrese su usuario" required>
                    <label for="username" class="form-label">Usuario</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Ingrese su contraseña" required>
                    <label for="password" class="form-label">Contraseña</label>
                </div>
                <!-- recordarme + olvidar -->
<!--                <div class="d-flex justify-content-between align-items-center mb-4">-->
<!--                    <div class="form-check">-->
<!--                        <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me">-->
<!--                        <label class="form-check-label" for="rememberMe">Recuérdame</label>-->
<!--                    </div>-->
<!--                    <a class="small" th:href="@{/forgot-password}">Olvidé mi contraseña</a>-->
<!--                </div>-->
                <!-- botón -->
                <div class="d-flex justify-content-center">
                    <button type="submit" class="btn btn-primary px-5">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<footer th:replace="~{plantillas/plantilla :: footer}"></footer>
</body>
</html>
